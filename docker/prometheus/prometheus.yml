global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080", "api-gateway:8080"]
        labels:
          application: "api-gateway"

  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8081", "auth-service:8081"]
        labels:
          application: "auth-service"

  - job_name: "product-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8082", "product-service:8082"]
        labels:
          application: "product-service"

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8083", "order-service:8083"]
        labels:
          application: "order-service"

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8084", "payment-service:8084"]
        labels:
          application: "payment-service"

  - job_name: "inventory-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8085", "inventory-service:8085"]
        labels:
          application: "inventory-service"

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8086", "notification-service:8086"]
        labels:
          application: "notification-service"
