name: CI - Build, Test & Docker Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Test & Verify Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Tests and Build BootJars
        run: ./gradlew test bootJar --continue --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Builds for All Microservices
        run: |
          services=(api-gateway auth-service product-service order-service payment-service inventory-service notification-service)
          for service in "${services[@]}"; do
            echo "Building Docker image for $service..."
            docker build -f "services/$service/Dockerfile" -t "ecommerce-$service:ci" .
          done
          echo "All 7 microservice Docker images built successfully!"
