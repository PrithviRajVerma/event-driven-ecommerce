apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
  INVENTORY_SERVICE_URL: "http://inventory-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  AUTH_DB_URL: "jdbc:postgresql://auth-db:5432/auth_db?options=-c%20TimeZone=UTC"
  PRODUCT_DB_URL: "jdbc:postgresql://product-db:5432/product_db?options=-c%20TimeZone=UTC"
  ORDER_DB_URL: "jdbc:postgresql://order-db:5432/order_db?options=-c%20TimeZone=UTC"
  INVENTORY_DB_URL: "jdbc:postgresql://inventory-db:5432/inventory_db?options=-c%20TimeZone=UTC"
  PAYMENT_DB_URL: "jdbc:postgresql://payment-db:5432/payment_db?options=-c%20TimeZone=UTC"
  NOTIFICATION_DB_URL: "jdbc:postgresql://notification-db:5432/notification_db?options=-c%20TimeZone=UTC"
