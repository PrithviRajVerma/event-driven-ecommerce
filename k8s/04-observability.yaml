# =========================================================================
# DISTRIBUTED TRACING: ZIPKIN
# =========================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.4
          ports:
            - containerPort: 9411

---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: ecommerce
spec:
  ports:
    - port: 9411
      targetPort: 9411
  selector:
    app: zipkin

# =========================================================================
# METRICS: PROMETHEUS
# =========================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "api-gateway"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["api-gateway:8080"]

      - job_name: "auth-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["auth-service:8081"]

      - job_name: "product-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["product-service:8082"]

      - job_name: "order-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["order-service:8083"]

      - job_name: "payment-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["payment-service:8084"]

      - job_name: "inventory-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["inventory-service:8085"]

      - job_name: "notification-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 5s
        static_configs:
          - targets: ["notification-service:8086"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus

# =========================================================================
# DASHBOARDS: GRAFANA
# =========================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecommerce
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
