services:

  auth-db:
    image: postgres:18.6
    container_name: ecommerce-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    networks:
      - ecommerce-network

  product-db:
    image: postgres:18.6
    container_name: ecommerce-product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql
    networks:
      - ecommerce-network


  order-db:
    image: postgres:18.6
    container_name: ecommerce-order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql
    networks:
     - ecommerce-network

  inventory-db:
    image: postgres:18.6
    container_name: ecommerce-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - inventory-db-data:/var/lib/postgresql
    networks:
      - ecommerce-network
    ports:
      - "5436:5432"

  payment-db:
    image: postgres:18.6
    container_name: ecommerce-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql
    networks:
      - ecommerce-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - ecommerce-network
    depends_on:
      - auth-db
      - product-db
      - order-db
      - inventory-db
      - payment-db


volumes:
  auth-db-data:
  product-db-data:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  pgadmin-data:

networks:
  ecommerce-network:
    driver: bridge
